services:
  - type: web
    name: deal-engine
    runtime: node
    # Was a static site. A static site has no server, so it could not check a
    # password — hence the change. Nothing to compile: server.js has no
    # dependencies, it serves the same pages it always did.
    buildCommand: ""
    startCommand: node server.js
    plan: free
    pullRequestPreviewsEnabled: false
    envVars:
      - key: MY_APPS_URL
        value: https://my-apps-management.onrender.com
      - key: MY_APPS_SLUG
        value: dealengine
      - key: MY_APPS_SECRET
        sync: false          # paste the Deal Engine secret from My Apps → Subscriptions
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
