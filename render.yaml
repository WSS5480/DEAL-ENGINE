services:
  - type: web
    name: deal-engine
    runtime: static
    # Nothing to compile. The pages are plain HTML with no dependencies,
    # so the repo root IS the published site.
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /finder
        destination: /index.html
      - type: rewrite
        source: /calculator
        destination: /calc.html
